name: minaret-experiment-geocoder

services:
  nominatim:
    image: mediagis/nominatim:5.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      PBF_URL: https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/north-america/canada/ontario-updates/
      REPLICATION_UPDATE_INTERVAL: "86400"
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD}
      IMPORT_STYLE: address
      # The Docker Desktop VM also runs Supabase. Keep PostgreSQL and parallel
      # indexing comfortably inside the configured 12 GiB VM allocation.
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_MAINTENANCE_WORK_MEM: 1GB
      POSTGRES_AUTOVACUUM_WORK_MEM: 256MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 8GB
      POSTGRES_MAX_WAL_SIZE: 2GB
      POSTGRES_CHECKPOINT_TIMEOUT: 30min
      THREADS: "4"
      GUNICORN_WORKERS: "4"
    shm_size: 2gb
    volumes:
      - nominatim-postgres:/var/lib/postgresql/16/main
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8080/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30m

volumes:
  nominatim-postgres:
